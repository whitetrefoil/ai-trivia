# 构建并通过 rsync over SSH 部署到外部 VPS。
# - pull_request：只构建，用作 frontmatter 校验（agent 提的 PR 不合规会直接红）
# - push 到 main / 手动触发：构建并发布到 VPS
#
# 需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   Secrets：  VPS_HOST、VPS_USER、VPS_PATH（服务器上的站点目录，如 /var/www/ai-trivia）、VPS_SSH_KEY（私钥）、
#              VPS_KNOWN_HOSTS（`ssh-keyscan -p <端口> <主机>` 的输出），可选 VPS_PORT（SSH 端口，默认 22）
#   Variables：SITE_URL（站点对外地址，如 https://blog.example.com）
name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # 只取消 PR 的旧构建，避免打断正在进行的部署
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 与本地开发保持一致；升级时同步修改 README
  HUGO_VERSION: 0.168.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Hugo
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      - name: Build
        # PR 构建不发布，用占位 baseURL 即可
        run: hugo --gc --minify --baseURL "${{ (github.event_name != 'pull_request' && vars.SITE_URL) || 'https://example.invalid' }}/"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./public
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: site
          path: ./public

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          : "${VPS_PATH:?请配置 Actions 密钥 VPS_PATH}"
          # --delete 会让服务器目录与构建产物完全一致，VPS_PATH 必须是专用目录
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${VPS_PORT} -o StrictHostKeyChecking=yes" \
            ./public/ "${VPS_USER}@${VPS_HOST}:${VPS_PATH%/}/"
