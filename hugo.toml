# 站点配置。baseURL 在 CI 中由 Actions 变量 SITE_URL 通过 --baseURL 覆盖，这里只作本地预览用。
baseURL = "http://localhost:1313/"
locale = "zh-CN"
defaultContentLanguage = "zh"
title = "AI Trivia"
timeZone = "Asia/Shanghai"

# 不需要标签/分类页，保持站点最小化
disableKinds = ["taxonomy", "term"]

# 文章主要由 AI agent 写入，date 很可能比构建时刻“晚”（时区或时钟差异）。
# 默认的 buildFuture = false 会让这类文章被静默跳过，所以这里显式打开。
buildFuture = true

[params]
  description = "记录那些由我的突发奇想而起、与 AI 展开的对话"

[markup.goldmark.renderer]
  # 不允许正文中的原始 HTML，避免生成内容混入脚本等
  unsafe = false

# 中文排版：中文字符之间的换行不再渲染成空格。
# escapedSpace 让 `\ ` 渲染为空，用来解决「加粗内容首尾是中文标点、外侧紧挨汉字」时 ** 失效的问题，
# 例如 `**阿德维塔（Adwaita）**\ 的象龟`。详见 AGENTS.md。
[markup.goldmark.extensions.cjk]
  enable = true
  eastAsianLineBreaks = true
  escapedSpace = true

# 数学公式：原样保留定界符内的 LaTeX，交给 layouts/_markup/render-passthrough.html
# 在构建时转成 MathML（不需要前端 JS / 字体）。不启用单个 `$`，避免与金额等文字冲突。
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    inline = [['\(', '\)']]
    block = [['\[', '\]'], ['$$', '$$']]

[markup.highlight]
  noClasses = true
  style = "github"
