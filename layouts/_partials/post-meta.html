{{- /* 文章元信息：日期 · provider / model */ -}}
<p class="post-meta">
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
  {{- with .Params.provider }}
  · <span class="post-provider">{{ . }}</span>
  {{- end }}
  {{- with .Params.model }}
  / <code class="post-model">{{ . }}</code>
  {{- end }}
</p>
